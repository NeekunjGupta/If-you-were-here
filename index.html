/* ===== movie planner + real recorder (MediaRecorder → MP4 where the browser supports it, else WebM) ===== */
function poseOf(e,last){return last?'close':ENV[e].k=='room'?'sit':'walk'}
function makePlan(s){const d=defn(s),h=s.hist,p=[{title:s.title,env:d.e0,tod:s.tod,d:4,px:1},{env:d.e0,tod:s.tod,text:d.i,pose:'walk',d:5,px:-1}];
 h.forEach((x,i)=>p.push({env:x.env,tod:i<2?s.tod:null,text:x.text,pose:poseOf(x.env,0),d:5.5,px:i%2?1:-1}));
 const L=h[h.length-1]||{env:d.e0,text:''};p.push({env:L.env,text:'And at the end of the day, it was still you and me.',pose:'close',d:7.5,px:1});return p}
function frame(c,W,H,plan,T){let i=0,a=0;while(i<plan.length-1&&T>=a+plan[i].d){a+=plan[i].d;i++}const lt=T-a,cur=plan[i];c.globalAlpha=1;c.fillStyle='#0e1038';c.fillRect(0,0,W,H);

function pad(ac,d,tot){const n=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.05,n+2);g.gain.setValueAtTime(.05,n+tot-3);g.gain.linearRampToValueAtTime(0,n+tot);g.connect(d);[220,277.2,329.6,440].forEach((f,i)=>{const o=ac.createOscillator();o.frequency.value=f;const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.1+i*.03;lg.gain.value=4;l.connect(lg);lg.connect(o.detune);l.start();o.connect(g);o.start();o.stop(n+tot+1)})}
async function render(s,onP,webmOnly){const W=960,H=540,cn=document.createElement('canvas');cn.width=W;cn.height=H;const c=cn.getContext('2d'),plan=makePlan(s),tot=plan.reduce((a,b)=>a+b.d,0);

 const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:3e6}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const fin=new Promise(r=>rec.onstop=r);rec.start(500);const t0=performance.now();

function playable(url){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;let d=0;const f=ok=>{if(!d){d=1;v.removeAttribute('src');res(ok)}};v.onloadeddata=()=>f(true);v.onerror=()=>f(false);setTimeout(()=>f(true),6000);v.src=url})}

/* ===== persistence (localStorage for stories; rendered videos live only in this browser session) ===== */
const MOV={};let busy=0;
const load=()=>{try{return JSON.parse(localStorage.getItem('iywh')||'[]')}catch(e){return[]}};
function save(s){try{const a=load().filter(x=>x.id!=s.id);a.unshift(s);localStorage.setItem('iywh',JSON.stringify(a))}catch(e){}}
const seen=()=>{try{return localStorage.getItem('iywh_seen')}catch(e){}},setSeen=()=>{try{localStorage.setItem('iywh_seen','1')}catch(e){}};

/* ===== UI ===== */
const ui=document.getElementById('ui'),cv=document.getElementById('bg'),cx=cv.getContext('2d'),T0=performance.now();let cur={env:'dream',tod:'night',pose:'close'},S=null,C={sc:'sea',mood:'Peaceful',pace:'Balanced',tod:'golden',note:''},step=0;
function fit(){const r=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*r;cv.height=innerHeight*r}addEventListener('resize',fit);fit();
(function loop(){if(!busy)draw(cx,cv.width,cv.height,cur,(performance.now()-T0)/1000);requestAnimationFrame(loop)})();
const show=h=>{ui.innerHTML=h;ui.scrollTop=0;document.getElementById('scrim').style.display=''},rnd=a=>a[Math.floor(Math.random()*a.length)];
const chips=(k,arr)=>arr.map(v=>`<button class="chip ${C[k]==v?'on':''}" onclick="C.${k}='${v}';creator()">${v}</button>`).join('');

function home(){cur={env:'dream',tod:'night',pose:'close'};const d=daysLeft();
 const cd=d===null?'A little world, made for your birthday':d==0?'Happy birthday':d==1?'1 day until your birthday':d+' days until your birthday';
 show(`<div class="c"><h1>IF YOU<br>WERE HERE</h1><p><i>Every world is different. Every story leads us back to each other.</i></p><p class="sm">${cd}</p>
 <button class="btn p" onclick="creator()">Create a New Story</button><button class="btn" onclick="cont()">Continue My Story</button><button class="btn" onclick="surprise()">Surprise Me</button><button class="btn" onclick="lib()">My Stories</button></div>`)}
function intro(){step=0;cur={env:'dream',tod:'night',pose:'walk'};
 show(`<div class="c"><p class="sm">SEVEN DAYS BEFORE YOUR DAY</p><p><i>Somewhere between all the places we haven't visited, all the things we haven't tried, and all the moments we haven't experienced together, there's a little world waiting for us.</i></p><button class="btn p" onclick="letter()">Step inside</button></div>`)}
function letter(){const d=daysLeft(),nm=CFG.nickname||CFG.name||'love',dl=d===7?'Your birthday is only seven days away':'Your birthday is on its way';cur={env:'forest',pose:'close'};
 show(`<div class="c"><div class="letter">${CFG.welcome?`<p>${CFG.welcome}</p>`:''}<p>Happy pre-birthday, my ${nm}. ❤️</p><p>${dl}, and I wanted to give you something a little different before your special day arrives.</p><p>I can't fit every place I want to take you, every moment I want to share with you, or every little adventure I imagine us having into one gift.</p><p>So I made you a little world instead.</p><p>You can change the setting, choose our adventures, imagine different versions of our perfect day, and come back whenever you want to create another story.</p><p>The details are yours to decide. But in every world, there's one thing I want to stay the same: at the end of the day, it's still you and me.</p><p>Now go create our first adventure. I wonder what your perfect day with me looks like. 💜</p></div><button class="btn p" onclick="setSeen();creator()">Create our first adventure</button></div>`)}
function creator(){const n=document.getElementById('note');if(n)C.note=n.value;cur={env:D[C.sc]?D[C.sc].e0:'dream',tod:C.tod,pose:'walk'};
 show(`<div class="c"><h2>Choose our world</h2><div class="grid">${SC.map(x=>`<button class="chip ${C.sc==x[0]?'on':''}" onclick="C.sc='${x[0]}';creator()">${x[1]}</button>`).join('')}</div>
 <p class="sm" style="margin-top:12px">MOOD</p>${chips('mood',Object.keys(MOODL))}<p class="sm">PACE</p>${chips('pace',Object.keys(STG))}<p class="sm">TIME OF DAY</p>${chips('tod',['morning','golden','night'])}
 <p class="sm">A DETAIL YOU WANT IN OUR DAY (OPTIONAL)</p><input id="note" type="text" value="${C.note.replace(/"/g,'')}" maxlength="80" placeholder="e.g. we share one umbrella"><button class="btn p" onclick="begin()">Begin our story</button><button class="btn" onclick="home()">Back</button></div>`)}
function surprise(){C.sc=rnd(SC)[0];C.mood=rnd(Object.keys(MOODL));C.pace=rnd(Object.keys(STG));C.tod=rnd(['morning','golden','night']);C.note='';cur={env:D[C.sc]?D[C.sc].e0:'dream',tod:C.tod,pose:'walk'};
 show(`<div class="c"><p class="sm">YOUR SURPRISE</p><h2>${SC.find(x=>x[0]==C.sc)[1]}</h2><p><i>${C.mood} · ${C.pace.toLowerCase()} · ${C.tod}</i></p><button class="btn p" onclick="begin()">Begin this story</button><button class="btn" onclick="surprise()">Surprise me again</button><button class="btn" onclick="creator()">Customise</button></div>`)}
function begin(){const n=document.getElementById('note');if(n)C.note=n.value;const src=rnd(['sea','road','city']);S={id:'s'+Date.now(),sc:C.sc,mood:C.mood,pace:C.pace,tod:C.tod,note:C.note,src,end:rnd([src,'dream']),ch:[],hist:[],done:0,at:new Date().toISOString(),movie:'none'};S.title=defn(S).n;save(S);play()}
function node(s){const d=defn(s),k=s.ch.length,g=STG[s.pace],last=s.hist[s.hist.length-1]||{env:d.e0,text:d.i+' '+MOODL[s.mood]};if(k>=g.length)return{...last,fin:1};const c=g[k];
 return{env:last.env,text:last.text,q:s.sc=='mix'&&c=='c'?'The road bends toward somewhere new':QS[c],opts:c=='a'?d.a:c=='b'?d.b[s.ch[0]]:c=='e'?EV:d.c,tod:k<2?s.tod:null}}
function play(){const n=node(S),tot=STG[S.pace].length;cur={env:n.env,tod:n.tod,pose:n.fin?'close':poseOf(n.env,0)};
 const top=`<div class="top"><button class="chip" onclick="save(S);home()">✕ Save &amp; exit</button><span class="sm">${S.ch.length}/${tot}</span></div>`;
 if(n.fin)return show(`${top}<div class="sheet"><div class="q">The day, together</div><p>${n.text}</p><p><i>And at the end of the day, it was still you and me.</i>${S.note?`<br><span class="sm">${S.note.replace(/</g,'')}</span>`:''}</p><button class="btn p" onclick="S.done=1;save(S);make()">Watch our movie</button></div>`);
 show(`${top}<div class="sheet"><p>${n.text}</p><div class="q">${n.q}</div>${n.opts.map((o,i)=>`<button class="btn" onclick="pick(${i})">${o[0]}</button>`).join('')}</div>`)}
function pick(i){const n=node(S),o=n.opts[i];S.ch.push(i);S.hist.push({env:o[2]=='KEEP'?n.env:o[2],text:o[1],l:o[0]});save(S);play()}
function cont(){const u=load().find(x=>!x.done);u?(S=u,play()):lib()}
async function make(){busy=0;const s=S;cur={env:s.hist.length?s.hist[s.hist.length-1].env:'dream',pose:'close'};const L=(m,p)=>show(`<div class="c"><h2>Making our movie</h2><p>${m}</p><div class="bar"><i style="width:${p||0}%"></i></div><p class="sm">Recording happens live in this browser, so please keep this tab open and in front (about 40 seconds).</p></div>`);
 L('Preparing scenes…',0);await new Promise(r=>setTimeout(r,500));busy=1;
 try{let r=await render(s,p=>L('Rendering animation…',Math.round(p*100)));busy=0;L('Checking the video plays…',100);if(!(await playable(r.url))){URL.revokeObjectURL(r.url);busy=1;r=await render(s,p=>L('Re-recording in a more compatible format…',Math.round(p*100)),true);busy=0}MOV[s.id]=r;s.movie='ready';save(s);watch()}

function watch(){const m=MOV[S.id];if(!m)return make();cur={env:'dream',tod:'night',pose:'close'};
 show(`<div class="c" style="max-width:900px"><video id="v" src="${m.url}" controls playsinline autoplay></video><p class="sm" style="margin-top:8px">${m.ext.toUpperCase()} · ${m.secs}s · stored in this browser session only; your story stays saved and can be re-rendered anytime.</p>
 <button class="btn s p" onclick="dl()">Download video</button><button class="btn s" onclick="live()">Watch live</button><button class="btn s" onclick="v.currentTime=0;v.play()">Replay</button><button class="btn s" onclick="creator()">Create another story</button><button class="btn s" onclick="lib()">My Stories</button></div>`);
 const v=document.getElementById('v');v.onerror=()=>{v.insertAdjacentHTML('afterend','<p>This phone could not play the recording. Tap Watch live to see the movie directly.</p>')};v.onloadedmetadata=()=>{if(v.duration===Infinity){v.currentTime=1e7;v.ontimeupdate=()=>{v.ontimeupdate=null;v.currentTime=0}}}}
let LV=0;
function live(){const s=S,plan=makePlan(s),tot=plan.reduce((a,b)=>a+b.d,0),id=++LV;busy=1;let ac;try{ac=new AudioContext();pad(ac,ac.destination,tot)}catch(e){}

 const t0=performance.now();(function f(){if(id!==LV)return;const T=(performance.now()-t0)/1000;if(T>=tot){end();const L=s.hist[s.hist.length-1];cur={env:L?L.env:'dream',pose:'close'};show('<div class="c"><h2>The end</h2><p><i>And at the end of the day, it was still you and me.</i></p><button class="btn p" onclick="live()">Watch again</button><button class="btn" onclick="creator()">Create another story</button><button class="btn" onclick="lib()">My Stories</button></div>');return}frame(cx,cv.width,cv.height,plan,T);requestAnimationFrame(f)})()}
function dl(){const m=MOV[S.id],a=document.createElement('a');a.href=m.url;a.download=(S.title||'our-story').replace(/\W+/g,'-')+'.'+m.ext;a.click()}
function lib(){const a=load();cur={env:'book',pose:'sit'};
 show(`<div class="c"><h2>My Stories</h2>${a.length?a.map(s=>`<div class="letter" style="margin-bottom:10px"><p style="margin:0"><b>${s.title}</b></p><p class="sm">${s.mood} · ${new Date(s.at).toLocaleDateString()} · ${s.done?'complete':'unfinished'}</p>
 <button class="btn s p" onclick="open_('${s.id}')">${s.done?(MOV[s.id]?'Watch movie':'Re-render movie'):'Continue'}</button>${s.done?`<button class="btn s" onclick="S=load().find(x=>x.id=='${s.id}');live()">Watch live</button>`:''}<button class="btn s" onclick="again('${s.id}')">New version</button><button class="btn s" onclick="del('${s.id}')">Delete</button></div>`).join(''):'<p><i>No stories yet.</i></p>'}
 <button class="btn" onclick="intro()">Replay the introduction</button><button class="btn" onclick="home()">Back</button></div>`)}
function open_(id){S=load().find(x=>x.id==id);S.done?(MOV[id]?watch():make()):play()}
function again(id){const o=load().find(x=>x.id==id);C={sc:o.sc,mood:o.mood,pace:o.pace,tod:o.tod,note:o.note||''};creator()}

</script></body></html>
